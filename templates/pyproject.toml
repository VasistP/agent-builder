[project]
name = "agent-pkg"
version = "0.1.0"
description = "Enterprise AI agent POC (scaffolded by agent-builder)."
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "anthropic>=0.40",
    "pydantic>=2.7",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-api>=1.27",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    # graders/deterministic.py validates json_schema cases for real; the grader
    # module is imported by the deterministic test suite too.
    "jsonschema>=4.23",
]
dashboard = ["streamlit>=1.37", "pandas>=2.2"]
evals = ["ollama>=0.3", "jsonschema>=4.23"]

[project.scripts]
agent-pkg = "agent_pkg.__main__:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle, I: isort, D: pydocstyle (docstrings mandatory).
select = ["E", "F", "I", "D", "B", "UP"]
ignore = ["D203", "D213", "D107"]  # D107: __init__ docstring optional (class docstring covers it)

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"tools/*" = ["D"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
pythonpath = ["src", "."]
markers = [
    "integration: touches real data-store containers (no model calls)",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/agent_pkg"]
# Model-call shims are covered by evals, not deterministic tests.
omit = ["src/agent_pkg/agent/model.py"]

[tool.mypy]
python_version = "3.12"
packages = ["agent_pkg"]
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_pkg"]
