name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    # Everything here runs under bare python3 with no dependencies — the same
    # constraint the tools themselves are held to, so another agent can run
    # these checks without this repo's environment.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: CAPABILITIES.md is current
        run: python3 tools/capabilities.py --check
      - name: Skills and references are inside their context budgets
        run: python3 tools/skill_budget.py --check

  scaffold:
    # The template IS the product. Checking only the docs meant the thing users
    # actually run was never exercised in CI — the eval runner in particular had
    # defects that a single import-and-run would have surfaced.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev --extra evals
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run python tools/context_budget.py --check
      - run: uv run python tools/functions_index.py --check
      - run: uv run pytest tests/ -q
      # Zero tokens and no API key: proves the coverage gate, the grader registry
      # and every import path in the eval runner actually load and run.
      - name: Eval runner loads and gates
        run: |
          uv run python -m evals.run_evals --check-coverage && exit 1
          test $? -eq 1
